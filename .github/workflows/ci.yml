name: Django CI

on: [push, pull_request]

env:
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Get Poetry cache path
        id: poetry-cache
        run: echo "path=$(poetry config cache-dir)/virtualenvs" >> $GITHUB_OUTPUT

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        id: cache-venv
        with:
          path: ${{ steps.poetry-cache.outputs.path }}
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run PEP8 compliance check
        run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Get Poetry cache path
        id: poetry-cache-test
        run: echo "path=$(poetry config cache-dir)/virtualenvs" >> $GITHUB_OUTPUT

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        id: cache-venv-test
        with:
          path: ${{ steps.poetry-cache-test.outputs.path }}
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run migrate
        run: poetry run python manage.py migrate

      - name: Run test
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          # Создаем временный .env файл
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env.tmp
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env.tmp
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.tmp
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.tmp

          # Собираем с использованием .env файла
          docker build \
            --secret id=env,src=.env.tmp \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/habit_tracker-web:${{ github.sha }} .

          # Удаляем временный файл
          rm .env.tmp

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/habit_tracker-web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo mkdir -p ${{ secrets.DEPLOY_DIR }}
            cd ${{ secrets.DEPLOY_DIR }}
          
            if [ ! -d .git ]; then
              sudo git clone --branch feature/kursach_docker https://github.com/Arty525/healthy-habits-tracker.git .
            fi
          
            sudo git fetch origin feature/kursach_docker
            sudo git reset --hard origin/feature/kursach_docker
            sudo git pull origin feature/kursach_docker
          
            # Останавливаем и удаляем старый контейнер
            docker stop habit_tracker-web || true
            docker rm habit_tracker-web || true
          
            # Pull нового образа
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/habit_tracker-web:${{ github.sha }}
          
            # Запускаем через docker-compose
            docker-compose down
            docker-compose up -d
            
            echo "Deployment completed!"
            docker-compose ps
          EOF